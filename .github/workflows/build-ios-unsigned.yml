# 云端编译出**未签名**的 iOS 包（免费 Apple ID 签名的前置步骤）
#
# 为什么要有它：Windows 上没有 Xcode，本地编不了 iOS 二进制；
# 而 Expo 的云构建（EAS）给真机签名需要 $99 开发者账号。
# 这条路绕开两者：GitHub 的 macOS 机器负责编译，签名的活交给 Windows 上的 Sideloadly
# （用你的免费 Apple ID，在本机完成签名，不需要开发者账号）。
#
# 产物：DSH-unsigned.ipa（未签名），下载后用 Sideloadly 打开 → 接上 iPhone → 签名安装。
#
# 注意：免费 Apple ID 签出来的证书 **7 天过期**，到期用 Sideloadly 重新签一次即可
# （不需要重新编译，同一个 ipa 可以反复签）。

name: build-ios-unsigned

on:
  # 手动触发（推荐）：仓库页面 Actions → 本工作流 → Run workflow
  workflow_dispatch:
  # 也可以推到主分支时自动跑
  push:
    branches: [main, master]

jobs:
  build:
    # 用 macOS 机器是硬要求：只有它能跑 xcodebuild。
    # macos-15 镜像里同时装了 Xcode 16.4（默认）和 26.x —— 我们要的是 26，
    # 所以下一步会显式 xcode-select 切过去。为什么不能只用默认的 16.4：
    #   expo-modules-jsi/apple/Package.swift 是 `swift-tools-version: 6.2`，
    #   Swift 6.2 只有 Xcode 26 才有；16.4（Swift 6.1）会在
    #   PhaseScriptExecution "Build ExpoModulesJSI xcframework" 直接失败。
    runs-on: macos-15
    timeout-minutes: 60

    env:
      # 让 expo prebuild 跳过 git 工作区检查：/ios 是 prebuild 现场生成的，
      # 非交互环境下那个 "working tree is dirty" 确认会直接把构建卡死。
      EXPO_NO_GIT_STATUS: '1'
      CI: '1'

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 选 Xcode 26（必须）+ 打印工具链版本
        run: |
          # 为什么必须换 Xcode：
          #   expo-modules-jsi 的 apple/Package.swift 头一行是
          #   `swift-tools-version: 6.2`，而 Swift 6.2 只在 Xcode 26 里。
          #   macos-15 镜像默认是 Xcode 16.4（Swift 6.1），
          #   → 嵌套 SwiftPM 构建直接报 tools version 不满足
          #   → 失败在 PhaseScriptExecution "Build ExpoModulesJSI xcframework"。
          ls -1 /Applications | grep -i '^Xcode' || true
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$XC" ]; then
            echo "没找到 Xcode 26，镜像里可用的 Xcode 见上面那行"
            exit 1
          fi
          echo "selected Xcode: $XC"
          sudo xcode-select -s "$XC"
          # DEVELOPER_DIR 同时导出给后续步骤：build-xcframework.sh 会把它
          # 转发给嵌套的 xcodebuild，保证内外用同一个工具链。
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
          node -v
          ruby -v
          pod --version

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装依赖
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: 校验（不通过就不编译，省得等半小时）
        run: |
          npx tsc --noEmit

      - name: 生成原生 iOS 工程（expo prebuild）
        run: |
          npx expo prebuild --platform ios
          ls -1 ios
          ls -1 ios/*.xcworkspace

      - name: 摘掉 aps-environment 权限（免费 Apple ID 没有推送能力，留着会签不上）
        run: |
          # expo-notifications 的 config plugin 会往 entitlements 里塞
          # aps-environment=development。而我们只用**本地**通知
          # （Notifications.scheduleNotificationAsync），本地通知不需要任何权限项。
          # 但推送权限项在「免费 Apple ID 个人团队」下不可用，
          # Sideloadly 签名时会因为 provisioning profile 里没有这个权限而失败。
          # 所以这里把它删掉 —— 只删权限项，通知功能本身不受影响。
          python3 - <<'PY'
          import glob, plistlib
          found = False
          for p in glob.glob('ios/**/*.entitlements', recursive=True):
              found = True
              with open(p, 'rb') as f:
                  d = plistlib.load(f)
              if 'aps-environment' in d:
                  del d['aps-environment']
                  with open(p, 'wb') as f:
                      plistlib.dump(d, f)
                  print('stripped aps-environment:', p)
              else:
                  print('no aps-environment:', p)
              print('remaining keys:', sorted(d.keys()))
          if not found:
              print('no .entitlements file at all (这样反而最省事)')
          PY

      - name: 编译（关闭签名）
        run: |
          cd ios
          # scheme 与应用名一致（app.json 里的 name 是 DSH）
          #
          # 为什么要逐个试 Xcode：
          #   - 新版 clang（Xcode 26.3）把 expo-modules-jsi 的 RuntimeScheduler.h
          #     里构造函数的 SWIFT_RETURNS_RETAINED 判成了**错误**：
          #     "'RuntimeScheduler' cannot be annotated with either SWIFT_RETURNS_RETAINED
          #      or SWIFT_RETURNS_UNRETAINED because it is not returning a
          #      SWIFT_SHARED_REFERENCE type"（类尾部才挂 SWIFT_SHARED_REFERENCE，
          #     新 clang 提前检查 → 判不出来）。
          #   - 但 Package.swift 又要 swift-tools-version 6.2，只有 Xcode 26.x 有。
          #   所以只能在 26.x 里挑一个 clang 不那么激进的：26.2 → 26.1.1 → 26.0.1。
          #   失败一次只要 ~1 分钟，比来回改配置便宜得多。
          #
          # 另外：**不要**把输出接 tail —— 真错误在最前面，接 tail 等于删掉病因。
          CANDIDATES=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V -r)
          echo "候选 Xcode（新→旧）:"; echo "$CANDIDATES"
          ALLFAIL=1
          for XC in $CANDIDATES; do
            VER=$(basename "$XC" .app)
            VER=${VER#Xcode_}
            echo "================ 试 Xcode $VER ================"
            sudo xcode-select -s "$XC"
            export DEVELOPER_DIR="$XC/Contents/Developer"
            DD="build-$VER"
            LOG="/tmp/xcodebuild-$VER.log"
            set +e
            xcodebuild \
              -workspace DSH.xcworkspace \
              -scheme DSH \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$DD" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              > "$LOG" 2>&1
            CODE=$?
            set -e
            echo "Xcode $VER 退出码: $CODE"
            if [ "$CODE" -eq 0 ]; then
              echo "== 用 Xcode $VER 编译成功 =="
              echo "CHOSEN_XCODE=$VER" >> "$GITHUB_ENV"
              echo "CHOSEN_DD=$DD" >> "$GITHUB_ENV"
              tail -n 15 "$LOG"
              ALLFAIL=0
              break
            fi
            echo "---- Xcode $VER 的错误行 ----"
            grep -nE 'error:|fatal error|BUILD FAILED|build commands failed' "$LOG" | head -n 30 || true
            echo "---- Xcode $VER 第一条 error 的上下文（含 include 链）----"
            FIRST=$(grep -nE 'error:' "$LOG" | head -n 1 | cut -d: -f1 || true)
            if [ -n "$FIRST" ]; then
              START=$(( FIRST > 30 ? FIRST - 30 : 1 ))
              sed -n "${START},$(( FIRST + 5 ))p" "$LOG"
            fi
          done
          if [ "$ALLFAIL" -ne 0 ]; then
            echo "所有候选 Xcode 都编译失败，见上面的错误行与 include 链"
            exit 1
          fi

      - name: 打成一个未签名的 ipa
        run: |
          set -euo pipefail
          echo "用 Xcode $CHOSEN_XCODE 的产物（derivedData: ios/$CHOSEN_DD）"
          APP_PATH=$(find "ios/$CHOSEN_DD/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -n 1)
          echo "app: $APP_PATH"
          rm -rf Payload DSH-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # ipa 就是一个含 Payload/<app> 的 zip —— 用 zip 而不是 mac 自带的 ditto，
          # 是为了保证压缩包里没有多余属性，Sideloadly 解析更稳。
          zip -qry DSH-unsigned.ipa Payload
          ls -lh DSH-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: DSH-unsigned.ipa
          retention-days: 14
