# 云端编译出**未签名**的 iOS 包（免费 Apple ID 签名的前置步骤）
#
# 为什么要有它：Windows 上没有 Xcode，本地编不了 iOS 二进制；
# 而 Expo 的云构建（EAS）给真机签名需要 $99 开发者账号。
# 这条路绕开两者：GitHub 的 macOS 机器负责编译，签名的活交给 Windows 上的 Sideloadly
# （用你的免费 Apple ID，在本机完成签名，不需要开发者账号）。
#
# 产物：DSH-unsigned.ipa（未签名），下载后用 Sideloadly 打开 → 接上 iPhone → 签名安装。
#
# 注意：免费 Apple ID 签出来的证书 **7 天过期**，到期用 Sideloadly 重新签一次即可
# （不需要重新编译，同一个 ipa 可以反复签）。

name: build-ios-unsigned

on:
  # 手动触发（推荐）：仓库页面 Actions → 本工作流 → Run workflow
  workflow_dispatch:
  # 也可以推到主分支时自动跑
  push:
    branches: [main, master]

jobs:
  build:
    # 用 macOS 机器是硬要求：只有它能跑 xcodebuild。
    #
    # 为什么是 macos-26 而不是 macos-15：
    #   Expo SDK 56/57 要求 **Xcode 26.4+**（Swift 6.3）。macos-15 镜像里最高只有
    #   Xcode 26.3（Swift 6.2.x），而 6.2.x 会把下面这个注解判成**硬错误**：
    #
    #     expo-modules-jsi/.../RuntimeScheduler.h:53 / :61
    #     error: 'RuntimeScheduler' cannot be annotated with either
    #     SWIFT_RETURNS_RETAINED or SWIFT_RETURNS_UNRETAINED because it is not
    #     returning a SWIFT_SHARED_REFERENCE type
    #
    #   —— 这是 expo-modules-jsi 57.0.5 引入的已知问题：
    #      https://github.com/expo/expo/issues/49214
    #      https://github.com/expo/expo/issues/49426
    #   Swift 6.2.1 / 6.2.3 报错；Swift 6.3 / 6.3.3 只当警告，构建正常通过。
    #   Expo 官方给的结论就是"升到 Xcode 26.4 或更新"。
    #
    #   macos-26 镜像自带 26.6（默认）/ 26.5 / 26.4.1 —— 满足要求。
    runs-on: macos-26
    timeout-minutes: 60

    env:
      # 让 expo prebuild 跳过 git 工作区检查：/ios 是 prebuild 现场生成的，
      # 非交互环境下那个 "working tree is dirty" 确认会直接把构建卡死。
      EXPO_NO_GIT_STATUS: '1'
      CI: '1'

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 选 Xcode（要 ≥26.4）+ 打印工具链版本
        run: |
          # 挑 Xcode 的规则：版本 ≥ 26.4（Swift ≥ 6.3），新的优先。
          # 26.3 及以下（Swift 6.2.x）会在 ExpoModulesJSI 那步直接报错，
          # 详见 jobs.build 顶部注释里的 issue 链接。
          ls -1 /Applications | grep -i '^Xcode' || true
          PICK=""
          for XC in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V -r); do
            V=$(basename "$XC" .app)
            V=${V#Xcode_}
            MAJ=${V%%.*}
            REST=${V#*.}
            MIN=${REST%%.*}
            if [ "$MAJ" -gt 26 ] || { [ "$MAJ" -eq 26 ] && [ "$MIN" -ge 4 ]; }; then
              PICK="$XC"
              break
            fi
          done
          if [ -z "$PICK" ]; then
            echo "镜像里没有 ≥26.4 的 Xcode，可用版本见上一行"
            exit 1
          fi
          echo "selected Xcode: $PICK"
          sudo xcode-select -s "$PICK"
          # DEVELOPER_DIR 同时导出给后续步骤：build-xcframework.sh 会把它
          # 转发给嵌套的 xcodebuild，保证内外用同一个工具链。
          echo "DEVELOPER_DIR=$PICK/Contents/Developer" >> "$GITHUB_ENV"
          # 记下这个版本号，编译步骤的第一顺位就试它。
          echo "PREFERRED_XCODE=$(basename "$PICK" .app | sed 's/Xcode_//')" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
          node -v
          ruby -v
          pod --version

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装依赖
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: 校验（不通过就不编译，省得等半小时）
        run: |
          npx tsc --noEmit

      - name: 生成原生 iOS 工程（expo prebuild）
        run: |
          npx expo prebuild --platform ios
          ls -1 ios
          ls -1 ios/*.xcworkspace

      - name: 摘掉 aps-environment 权限（免费 Apple ID 没有推送能力，留着会签不上）
        run: |
          # expo-notifications 的 config plugin 会往 entitlements 里塞
          # aps-environment=development。而我们只用**本地**通知
          # （Notifications.scheduleNotificationAsync），本地通知不需要任何权限项。
          # 但推送权限项在「免费 Apple ID 个人团队」下不可用，
          # Sideloadly 签名时会因为 provisioning profile 里没有这个权限而失败。
          # 所以这里把它删掉 —— 只删权限项，通知功能本身不受影响。
          python3 - <<'PY'
          import glob, plistlib
          found = False
          for p in glob.glob('ios/**/*.entitlements', recursive=True):
              found = True
              with open(p, 'rb') as f:
                  d = plistlib.load(f)
              if 'aps-environment' in d:
                  del d['aps-environment']
                  with open(p, 'wb') as f:
                      plistlib.dump(d, f)
                  print('stripped aps-environment:', p)
              else:
                  print('no aps-environment:', p)
              print('remaining keys:', sorted(d.keys()))
          if not found:
              print('no .entitlements file at all (这样反而最省事)')
          PY

      - name: 编译（关闭签名）
        run: |
          cd ios
          # scheme 与应用名一致（app.json 里的 name 是 DSH）
          #
          # 候选顺序：先前一步挑出来的那个（PREFERRED_XCODE，≥26.4），
          # 再按"新→旧"排剩下的 ≥26.4 版本。每个候选用独立的 derivedDataPath，
          # 失败就换下一个（失败一次约 1 分钟），不用来回改配置。
          # 为什么必须 ≥26.4，见 jobs.build 顶部的注释（expo/expo#49214、#49426）。
          #
          # 另外：**不要**把输出接 tail —— 真错误在最前面，接 tail 等于删掉病因。
          ALL_XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V -r)
          CANDIDATES=""
          if [ -n "${PREFERRED_XCODE:-}" ] && [ -d "/Applications/Xcode_$PREFERRED_XCODE.app" ]; then
            CANDIDATES="/Applications/Xcode_$PREFERRED_XCODE.app"
          fi
          for XC in $ALL_XC; do
            V=$(basename "$XC" .app); V=${V#Xcode_}
            MAJ=${V%%.*}; REST=${V#*.}; MIN=${REST%%.*}
            if [ "$MAJ" -gt 26 ] || { [ "$MAJ" -eq 26 ] && [ "$MIN" -ge 4 ]; }; then
              case " $CANDIDATES " in
                *" $XC "*) ;;
                *) CANDIDATES="$CANDIDATES $XC" ;;
              esac
            fi
          done
          echo "候选 Xcode（≥26.4）:"; echo "$CANDIDATES"
          ALLFAIL=1
          for XC in $CANDIDATES; do
            VER=$(basename "$XC" .app)
            VER=${VER#Xcode_}
            echo "================ 试 Xcode $VER ================"
            sudo xcode-select -s "$XC"
            export DEVELOPER_DIR="$XC/Contents/Developer"
            DD="build-$VER"
            LOG="/tmp/xcodebuild-$VER.log"
            swift --version
            set +e
            xcodebuild \
              -workspace DSH.xcworkspace \
              -scheme DSH \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$DD" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              > "$LOG" 2>&1
            CODE=$?
            set -e
            echo "Xcode $VER 退出码: $CODE"
            if [ "$CODE" -eq 0 ]; then
              echo "== 用 Xcode $VER 编译成功 =="
              echo "CHOSEN_XCODE=$VER" >> "$GITHUB_ENV"
              echo "CHOSEN_DD=$DD" >> "$GITHUB_ENV"
              tail -n 15 "$LOG"
              ALLFAIL=0
              break
            fi
            echo "---- Xcode $VER 的错误行 ----"
            grep -nE 'error:|fatal error|BUILD FAILED|build commands failed' "$LOG" | head -n 30 || true
            echo "---- Xcode $VER 第一条 error 的上下文（含 include 链）----"
            FIRST=$(grep -nE 'error:' "$LOG" | head -n 1 | cut -d: -f1 || true)
            if [ -n "$FIRST" ]; then
              START=$(( FIRST > 30 ? FIRST - 30 : 1 ))
              sed -n "${START},$(( FIRST + 5 ))p" "$LOG"
            fi
          done
          if [ "$ALLFAIL" -ne 0 ]; then
            echo "所有候选 Xcode 都编译失败，见上面的错误行与 include 链"
            exit 1
          fi

      - name: 打成一个未签名的 ipa
        run: |
          set -euo pipefail
          echo "用 Xcode $CHOSEN_XCODE 的产物（derivedData: ios/$CHOSEN_DD）"
          APP_PATH=$(find "ios/$CHOSEN_DD/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -n 1)
          echo "app: $APP_PATH"
          rm -rf Payload DSH-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # ipa 就是一个含 Payload/<app> 的 zip —— 用 zip 而不是 mac 自带的 ditto，
          # 是为了保证压缩包里没有多余属性，Sideloadly 解析更稳。
          zip -qry DSH-unsigned.ipa Payload
          ls -lh DSH-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: DSH-unsigned.ipa
          retention-days: 14
