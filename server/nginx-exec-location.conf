# 把这段并进你现有的 server 块（就是 dsh-gate.conf 里监听 18080 的那个）。
#
# 它复用同一个 dshg cookie 门禁：手机带着 ?token=... 打开过一次 DSH 手机页之后，
# cookie 就在了，远程执行也就跟着通了 —— 不用再记第二个门禁。
#
# 手机上填的地址是：https://<域名或IP>:18080/exec
# 注意 proxy_pass 末尾那个 "/" 会把 /exec 前缀剥掉再转给代理，别漏。

location /exec/ {
    set $exec_gate "";
    if ($cookie_dshg = "REPLACE_WITH_YOUR_GATE_TOKEN") { set $exec_gate "1"; }
    if ($arg_token = "REPLACE_WITH_YOUR_GATE_TOKEN") { set $exec_gate "1"; }
    if ($exec_gate = "") { return 401; }

    # 只有本机能直连代理，外部一律走这里
    proxy_pass http://127.0.0.1:7717/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 命令可能跑很久：读超时要大于执行代理自己的上限（默认 120s，上限 600s）
    proxy_read_timeout 700s;
    proxy_send_timeout 700s;

    # 别对 /exec 限速：跑一次构建就是几十个请求，限速会把它打死
    client_max_body_size 8m;
}
